{% extends "base.html" %}

{% block title %}Edit Project - FPRMS{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="mb-0">Edit Project Details</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_project', project_id=project.ProjectID) }}">
                
                <!-- Project Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">Project Title</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ project.Title }}" required>
                    <div class="form-text">Make it clear and descriptive to attract the right freelancers.</div>
                </div>
                
                <!-- Project Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">Project Description</label>
                    <textarea class="form-control" id="description" name="description" rows="6" required>{{ project.Description }}</textarea>
                    <div class="form-text">Be specific about your requirements, goals, and any special instructions.</div>
                </div>
                
                <div class="row">
                    <!-- Budget -->
                    <div class="col-md-6 mb-3">
                        <label for="budget" class="form-label">Budget ($)</label>
                        <input type="number" step="0.01" class="form-control" id="budget" name="budget" value="{{ project.Budget }}" required>
                    </div>
                    
                    <!-- Project Status -->
                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label">Project Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="open" {% if project.Status == 'open' %}selected{% endif %}>Open for Bids</option>
                            <option value="in_progress" {% if project.Status == 'in_progress' %}selected{% endif %}>In Progress</option>
                            <option value="completed" {% if project.Status == 'completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                </div>

                <hr>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Changes
                        </button>
                        <!-- THIS IS THE NEW BUTTON YOU REQUESTED -->
                        <a href="{{ url_for('project_details', project_id=project.ProjectID) }}" class="btn btn-info text-white">
                            <i class="fas fa-tasks me-2"></i>Manage Milestones
                        </a>
                    </div>
                    <a href="{{ url_for('project_details', project_id=project.ProjectID) }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
